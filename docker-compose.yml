services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server","--save","","--appendonly","no","--maxmemory","${REDIS_MAXMEMORY:-4gb}","--maxmemory-policy","noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lnis]
  server:
    build:
      context: .
      dockerfile: lnis-server/Dockerfile
    environment:
      REDIS_HOST: redis
      LNIS_AGENT_TOKENS: ${LNIS_AGENT_TOKENS:-sender-1=change-me-sender,receiver-1=change-me-receiver}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/lnis/api/v1/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [lnis]
  nginx:
    build:
      context: .
      dockerfile: lnis-web/Dockerfile
    ports:
      - "0.0.0.0:8088:8088"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks: [lnis]
networks:
  lnis:
    driver: bridge

