services:
  server:
    build:
      context: .
      dockerfile: lnis-server/Dockerfile
    environment:
      LNIS_AGENT_TOKENS: ${LNIS_AGENT_TOKENS:-sender-1=change-me-sender,receiver-1=change-me-receiver}
      LNIS_DB_URL: "jdbc:h2:file:/app/data/lnis"
      LNIS_DB_USERNAME: ${LNIS_DB_USERNAME:-sa}
      LNIS_DB_PASSWORD: ${LNIS_DB_PASSWORD:-}
      LNIS_DATA_DIR: /app/data
      LNIS_INCOMPLETE_RETENTION: ${LNIS_INCOMPLETE_RETENTION:-PT1H}
      LNIS_COMPLETED_RETENTION: ${LNIS_COMPLETED_RETENTION:-PT24H}
      LNIS_CLEANUP_DELAY: ${LNIS_CLEANUP_DELAY:-PT10M}
    volumes:
      - ./DB:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/lnis/api/v1/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [lnis]
  nginx:
    build:
      context: .
      dockerfile: lnis-web/Dockerfile
    ports:
      - "0.0.0.0:8088:8088"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks: [lnis]
networks:
  lnis:
    driver: bridge

