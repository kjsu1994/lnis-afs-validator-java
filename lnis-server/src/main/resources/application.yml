server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 2MB
spring:
  application:
    name: lnis-server
  datasource:
    url: ${LNIS_DB_URL:jdbc:h2:file:./data/lnis}
    username: ${LNIS_DB_USERNAME:sa}
    password: ${LNIS_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
lnis:
  agent-tokens: ${LNIS_AGENT_TOKENS:sender-1=change-me-sender,receiver-1=change-me-receiver}
  storage:
    data-directory: ${LNIS_DATA_DIR:./data}
    incomplete-retention: ${LNIS_INCOMPLETE_RETENTION:PT1H}
    completed-retention: ${LNIS_COMPLETED_RETENTION:PT24H}
    cleanup-delay: ${LNIS_CLEANUP_DELAY:PT10M}
management:
  endpoints:
    web:
      base-path: /lnis/api/v1/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

