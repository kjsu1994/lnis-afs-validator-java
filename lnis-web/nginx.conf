server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 2m;

    location = / { return 302 /lnis/test/sender; }
    location = /lnis/test/sender { try_files /sender.html =404; }
    location = /lnis/test/receiver { try_files /receiver.html =404; }
    location /lnis/assets/ { alias /usr/share/nginx/html/assets/; expires 1h; }

    location /lnis/api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /lnis/ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }
    location /lnis/agent/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-LNIS-Agent-Id $http_x_lnis_agent_id;
        proxy_read_timeout 1d;
    }
}

